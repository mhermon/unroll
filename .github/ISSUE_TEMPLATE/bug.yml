name: Bug or unsupported format
description: Report a problem using a sanitized example.
body:
  - type: input
    id: versions
    attributes:
      label: Extension, VS Code and OS versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected behavior and actual behavior
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal synthetic or sanitized example
      description: Remove credentials, private conversations, personal information and internal paths.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have removed secrets and private information from this report.
          required: true
